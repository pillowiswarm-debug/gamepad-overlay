<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas
        id="base"
        width="1000"
        height="667">
    </canvas>
</div>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const WIDTH = 1000;
const HEIGHT = 667;

/*
   Maximum joystick movement.

   START WITH 20.

   If it still goes outside the socket:
       18
       16
       14

   If it doesn't reach the edge:
       22
       24
*/

const STICK_RANGE = 20;


/*
   Controller stick deadzone.
*/

const DEADZONE = 0.08;


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   VARIABLES
===================================================== */

let normalImage = null;

let buttonOverlays = {};

let leftStickImage = null;

let rightStickImage = null;

let gamepad = null;


/* =====================================================
   JOYSTICK CENTERS
===================================================== */

/*
   These are the CENTER coordinates of the
   normal joystick caps.

   IMPORTANT:

   If the joystick is sitting perfectly in
   the socket at neutral, DON'T change these.

   If it is slightly misplaced, change these.
*/

const LEFT_STICK = {
    x: 340,
    y: 410
};

const RIGHT_STICK = {
    x: 660,
    y: 410
};


/* =====================================================
   BUTTON FILES
===================================================== */

const buttonFiles = {

    x:
        "controller_x_pressed.png",

    o:
        "controller_o_pressed.png",

    square:
        "controller_square_pressed.png",

    triangle:
        "controller_triangle_pressed.png",

    L1:
        "controller_L1_pressed.png",

    R1:
        "controller_R1_pressed.png",

    dpadup:
        "controller_dpadup_pressed.png",

    dpaddown:
        "controller_dpaddown_pressed.png",

    dpadleft:
        "controller_dpadleft_pressed.png",

    dpadright:
        "controller_dpadright_pressed.png",

    touchpad:
        "controller_touchpad_pressed.png"
};


/* =====================================================
   BUTTON MAP
===================================================== */

const buttonMap = {

    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();

            image.onload =
                () => resolve(image);

            image.onerror =
                () => {

                    reject(
                        new Error(
                            "Could not load " +
                            src
                        )
                    );

                };

            image.src = src;
        }
    );
}


/* =====================================================
   GET IMAGE DATA
===================================================== */

function getImageData(image) {

    const temp =
        document.createElement(
            "canvas"
        );

    temp.width =
        WIDTH;

    temp.height =
        HEIGHT;

    const tempCtx =
        temp.getContext(
            "2d"
        );

    tempCtx.drawImage(
        image,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    return tempCtx.getImageData(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/* =====================================================
   BUTTON OVERLAY
===================================================== */

function createButtonOverlay(
    normalData,
    pressedData
) {

    const overlay =
        document.createElement(
            "canvas"
        );

    overlay.width =
        WIDTH;

    overlay.height =
        HEIGHT;

    const overlayCtx =
        overlay.getContext(
            "2d"
        );

    const output =
        overlayCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;


    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const difference =

            Math.abs(
                normal[i] -
                pressed[i]
            )

            +

            Math.abs(
                normal[i + 1] -
                pressed[i + 1]
            )

            +

            Math.abs(
                normal[i + 2] -
                pressed[i + 2]
            )

            +

            Math.abs(
                normal[i + 3] -
                pressed[i + 3]
            );


        if (
            difference > 12
        ) {

            result[i] =
                pressed[i];

            result[i + 1] =
                pressed[i + 1];

            result[i + 2] =
                pressed[i + 2];

            result[i + 3] =
                pressed[i + 3];

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }


    overlayCtx.putImageData(
        output,
        0,
        0
    );

    return overlay;
}


/* =====================================================
   STICK DEADZONE
===================================================== */

function normalizeStick(value) {

    if (
        Math.abs(value) <
        DEADZONE
    ) {

        return 0;
    }


    const sign =
        value < 0
            ? -1
            : 1;


    const amount =

        (
            Math.abs(value) -
            DEADZONE
        )
        /
        (
            1 -
            DEADZONE
        );


    return (
        sign *
        Math.min(
            amount,
            1
        )
    );
}


/* =====================================================
   DRAW STICK
===================================================== */

function drawStick(
    image,
    position,
    axisX,
    axisY
) {

    if (!image)
        return;


    /*
       Convert controller input
       to -1 through +1.
    */

    let x =
        normalizeStick(
            axisX
        );

    let y =
        normalizeStick(
            axisY
        );


    /*
       Make sure the stick can NEVER
       exceed the circular socket.

       This preserves the direction while
       keeping the total movement within
       the allowed radius.
    */

    const length =
        Math.sqrt(
            x * x +
            y * y
        );


    if (
        length > 1
    ) {

        x =
            x / length;

        y =
            y / length;
    }


    /*
       Convert normalized movement
       into actual pixels.
    */

    const offsetX =
        x *
        STICK_RANGE;

    const offsetY =
        y *
        STICK_RANGE;


    /*
       Final center position.
    */

    const finalX =
        position.x +
        offsetX;

    const finalY =
        position.y +
        offsetY;


    /*
       Draw the NORMAL joystick cap.

       Only the cap moves.

       The controller itself does NOT move.
    */

    ctx.drawImage(
        image,

        finalX -
        image.width / 2,

        finalY -
        image.height / 2
    );
}


/* =====================================================
   FIND GAMEPAD
===================================================== */

function findGamepad() {

    const pads =
        navigator.getGamepads();


    /*
       Continue using our current
       controller if it still exists.
    */

    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[
                gamepad.index
            ];

        return gamepad;
    }


    /*
       Otherwise find the first
       connected controller.
    */

    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad =
                pad;

            return pad;
        }
    }


    return null;
}


/* =====================================================
   UPDATE CONTROLLER
===================================================== */

function updateController() {


    /*
       -----------------------------------------
       DRAW NORMAL CONTROLLER
       -----------------------------------------
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       Find controller.
    */

    const pad =
        findGamepad();


    if (pad) {


        /*
           -------------------------------------
           DRAW BUTTONS
           -------------------------------------
        */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];


            if (
                !button ||
                !button.pressed
            ) {

                continue;
            }


            const name =
                buttonMap[index];


            const overlay =
                buttonOverlays[name];


            if (!overlay)
                continue;


            ctx.drawImage(
                overlay,
                0,
                0
            );
        }


        /*
           -------------------------------------
           LEFT JOYSTICK
           -------------------------------------
        */

        drawStick(

            leftStickImage,

            LEFT_STICK,

            pad.axes[0] || 0,

            pad.axes[1] || 0
        );


        /*
           -------------------------------------
           RIGHT JOYSTICK
           -------------------------------------
        */

        drawStick(

            rightStickImage,

            RIGHT_STICK,

            pad.axes[2] || 0,

            pad.axes[3] || 0
        );
    }


    /*
       Continue rendering.
    */

    requestAnimationFrame(
        updateController
    );
}


/* =====================================================
   GAMEPAD CONNECTED
===================================================== */

window.addEventListener(
    "gamepadconnected",

    function(event) {

        gamepad =
            event.gamepad;

        console.log(
            "Gamepad connected:"
        );

        console.log(
            gamepad.id
        );
    }
);


/* =====================================================
   GAMEPAD DISCONNECTED
===================================================== */

window.addEventListener(
    "gamepaddisconnected",

    function(event) {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

async function start() {

    try {


        console.log(
            "Loading PS5 overlay..."
        );


        /*
           -------------------------------------
           NORMAL CONTROLLER
           -------------------------------------
        */

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        const normalData =
            getImageData(
                normalImage
            );


        /*
           -------------------------------------
           BUTTONS
           -------------------------------------
        */

        for (
            const name in buttonFiles
        ) {

            const pressedImage =
                await loadImage(
                    buttonFiles[name]
                );


            const pressedData =
                getImageData(
                    pressedImage
                );


            buttonOverlays[name] =

                createButtonOverlay(

                    normalData,

                    pressedData
                );
        }


        /*
           -------------------------------------
           NORMAL LEFT STICK
           -------------------------------------
        */

        leftStickImage =
            await loadImage(
                "left_stick.png"
            );


        /*
           -------------------------------------
           NORMAL RIGHT STICK
           -------------------------------------
        */

        rightStickImage =
            await loadImage(
                "right_stick.png"
            );


        console.log(
            "=============================="
        );

        console.log(
            "PS5 OVERLAY READY"
        );

        console.log(
            "Left stick:",
            leftStickImage.width,
            "x",
            leftStickImage.height
        );

        console.log(
            "Right stick:",
            rightStickImage.width,
            "x",
            rightStickImage.height
        );

        console.log(
            "=============================="
        );


        /*
           Start the animation.
        */

        requestAnimationFrame(
            updateController
        );


    } catch (error) {

        console.error(
            "OVERLAY ERROR:",
            error
        );
    }
}


/* =====================================================
   RUN
===================================================== */

start();

</script>

</body>
</html>
