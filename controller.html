<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const WIDTH = 1000;
const HEIGHT = 667;

/*
   Maximum distance the joystick cap moves.

   Change this later if needed:
   25 = small
   35 = medium
   45 = large
*/

const STICK_RANGE = 35;

/*
   Prevent tiny analog drift.
*/

const DEADZONE = 0.08;

/*
   Difference between normal and pressed images
   required for a pixel to be considered changed.
*/

const DIFFERENCE_THRESHOLD = 25;


/* =====================================================
   CONTROLLER BUTTON FILES
===================================================== */

const files = {

    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


/* =====================================================
   STANDARD DUALSENSE BUTTON MAP
===================================================== */

const buttonMap = {

    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");


let normalImage = null;

let overlays = {};

let leftStick = null;

let rightStick = null;

let gamepad = null;


/* =====================================================
   IMAGE LOADING
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => {

            reject(
                new Error(
                    "Could not load: " + src
                )
            );

        };

        img.src = src;
    });
}


/* =====================================================
   GET IMAGE DATA
===================================================== */

function getImageData(img) {

    const temp =
        document.createElement("canvas");

    temp.width = WIDTH;
    temp.height = HEIGHT;

    const tempCtx =
        temp.getContext("2d");

    tempCtx.drawImage(
        img,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    return tempCtx.getImageData(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/* =====================================================
   CREATE BUTTON DIFFERENCE
===================================================== */

function createButtonOverlay(
    normalData,
    pressedData
) {

    const overlay =
        document.createElement("canvas");

    overlay.width = WIDTH;
    overlay.height = HEIGHT;

    const overlayCtx =
        overlay.getContext("2d");

    const output =
        overlayCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;


    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const difference =
            Math.abs(
                normal[i] -
                pressed[i]
            ) +

            Math.abs(
                normal[i + 1] -
                pressed[i + 1]
            ) +

            Math.abs(
                normal[i + 2] -
                pressed[i + 2]
            ) +

            Math.abs(
                normal[i + 3] -
                pressed[i + 3]
            );


        if (
            difference > 12
        ) {

            result[i] =
                pressed[i];

            result[i + 1] =
                pressed[i + 1];

            result[i + 2] =
                pressed[i + 2];

            result[i + 3] =
                pressed[i + 3];

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }


    overlayCtx.putImageData(
        output,
        0,
        0
    );


    return overlay;
}


/* =====================================================
   FIND CHANGED PIXELS
===================================================== */

function findChangedPixels(
    normalData,
    pressedData
) {

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const pixels = [];


    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const index =
                (y * WIDTH + x) * 4;


            const difference =
                Math.abs(
                    normal[index] -
                    pressed[index]
                ) +

                Math.abs(
                    normal[index + 1] -
                    pressed[index + 1]
                ) +

                Math.abs(
                    normal[index + 2] -
                    pressed[index + 2]
                ) +

                Math.abs(
                    normal[index + 3] -
                    pressed[index + 3]
                );


            if (
                difference >
                DIFFERENCE_THRESHOLD
            ) {

                pixels.push({
                    x: x,
                    y: y,
                    index: index
                });
            }
        }
    }


    return pixels;
}


/* =====================================================
   CREATE CROPPED JOYSTICK
===================================================== */

function createStick(
    normalData,
    pressedData,
    name
) {

    const pressed =
        pressedData.data;


    const pixels =
        findChangedPixels(
            normalData,
            pressedData
        );


    console.log(
        name +
        " changed pixels:",
        pixels.length
    );


    if (
        pixels.length === 0
    ) {

        console.error(
            name +
            " joystick could not be detected."
        );

        return null;
    }


    /*
       Find the exact bounding box
       around the changed joystick pixels.
    */

    let minX = WIDTH;
    let minY = HEIGHT;

    let maxX = 0;
    let maxY = 0;


    for (
        const pixel of pixels
    ) {

        if (
            pixel.x < minX
        )
            minX = pixel.x;

        if (
            pixel.y < minY
        )
            minY = pixel.y;

        if (
            pixel.x > maxX
        )
            maxX = pixel.x;

        if (
            pixel.y > maxY
        )
            maxY = pixel.y;
    }


    /*
       Small padding prevents clipping
       around the edge of the circle.
    */

    const padding = 4;


    const width =
        maxX -
        minX +
        1;

    const height =
        maxY -
        minY +
        1;


    const size =
        Math.max(
            width,
            height
        ) +
        padding * 2;


    /*
       Original center of the joystick
       on the controller.
    */

    const centerX =
        (minX + maxX) / 2;

    const centerY =
        (minY + maxY) / 2;


    console.log(
        name +
        " center:",
        centerX,
        centerY
    );


    console.log(
        name +
        " size:",
        size
    );


    /*
       Create a small transparent canvas
       containing ONLY the joystick.
    */

    const sprite =
        document.createElement("canvas");

    sprite.width =
        size;

    sprite.height =
        size;


    const spriteCtx =
        sprite.getContext("2d");


    const output =
        spriteCtx.createImageData(
            size,
            size
        );

    const result =
        output.data;


    /*
       Copy the joystick pixels into
       the cropped sprite.
    */

    for (
        const pixel of pixels
    ) {

        const localX =
            pixel.x -
            minX +
            padding;


        const localY =
            pixel.y -
            minY +
            padding;


        const targetIndex =
            (
                localY *
                size +
                localX
            ) * 4;


        const sourceIndex =
            pixel.index;


        result[targetIndex] =
            pressed[sourceIndex];

        result[targetIndex + 1] =
            pressed[sourceIndex + 1];

        result[targetIndex + 2] =
            pressed[sourceIndex + 2];

        result[targetIndex + 3] =
            pressed[sourceIndex + 3];
    }


    spriteCtx.putImageData(
        output,
        0,
        0
    );


    return {

        image: sprite,

        centerX: centerX,

        centerY: centerY,

        size: size
    };
}


/* =====================================================
   ANALOG DEADZONE
===================================================== */

function normalizeAxis(value) {

    if (
        Math.abs(value) <
        DEADZONE
    ) {

        return 0;
    }


    const sign =
        value < 0
            ? -1
            : 1;


    const magnitude =
        (
            Math.abs(value) -
            DEADZONE
        ) /
        (1 - DEADZONE);


    return (
        sign *
        Math.min(
            magnitude,
            1
        )
    );
}


/* =====================================================
   DRAW JOYSTICK
===================================================== */

function drawStick(
    stick,
    axisX,
    axisY
) {

    if (!stick)
        return;


    /*
       Convert controller axes
       into -1 to +1 movement.
    */

    const normalizedX =
        normalizeAxis(axisX);

    const normalizedY =
        normalizeAxis(axisY);


    /*
       Calculate pixel movement.
    */

    const moveX =
        normalizedX *
        STICK_RANGE;

    const moveY =
        normalizedY *
        STICK_RANGE;


    /*
       IMPORTANT:

       centerX / centerY are the ORIGINAL
       joystick coordinates in the controller.

       We put the center of the cropped
       joystick exactly there, then add
       the analog movement.
    */

    const drawX =
        stick.centerX -
        stick.size / 2 +
        moveX;

    const drawY =
        stick.centerY -
        stick.size / 2 +
        moveY;


    ctx.drawImage(
        stick.image,
        drawX,
        drawY
    );
}


/* =====================================================
   FIND GAMEPAD
===================================================== */

function findGamepad() {

    const pads =
        navigator.getGamepads();


    /*
       Keep using the same controller.
    */

    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }


    /*
       Otherwise find the first connected
       controller.
    */

    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad =
                pad;

            return pad;
        }
    }


    return null;
}


/* =====================================================
   UPDATE CONTROLLER
===================================================== */

function updateController() {

    /*
       Start with the normal controller.
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const pad =
        findGamepad();


    if (pad) {


        /* =============================================
           BUTTONS
        ============================================= */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];


            if (
                !button ||
                !button.pressed
            )
                continue;


            const name =
                buttonMap[index];


            const overlay =
                overlays[name];


            if (!overlay)
                continue;


            ctx.drawImage(
                overlay,
                0,
                0
            );
        }


        /* =============================================
           LEFT STICK
        ============================================= */

        drawStick(
            leftStick,

            pad.axes[0] || 0,

            pad.axes[1] || 0
        );


        /* =============================================
           RIGHT STICK
        ============================================= */

        drawStick(
            rightStick,

            pad.axes[2] || 0,

            pad.axes[3] || 0
        );
    }


    requestAnimationFrame(
        updateController
    );
}


/* =====================================================
   GAMEPAD CONNECTED
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;


        console.log(
            "Gamepad connected:",
            gamepad.id
        );
    }
);


/* =====================================================
   GAMEPAD DISCONNECTED
===================================================== */

window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START EVERYTHING
===================================================== */

async function start() {

    try {

        console.log(
            "Loading controller..."
        );


        /* =============================================
           NORMAL CONTROLLER
        ============================================= */

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        const normalData =
            getImageData(
                normalImage
            );


        /* =============================================
           BUTTONS
        ============================================= */

        for (
            const name in files
        ) {

            const pressedImage =
                await loadImage(
                    files[name]
                );


            const pressedData =
                getImageData(
                    pressedImage
                );


            overlays[name] =
                createButtonOverlay(
                    normalData,
                    pressedData
                );
        }


        /* =============================================
           LEFT JOYSTICK
        ============================================= */

        const leftImage =
            await loadImage(
                "controller_LeftAnalog_pressed.png"
            );


        const leftData =
            getImageData(
                leftImage
            );


        leftStick =
            createStick(
                normalData,
                leftData,
                "LEFT STICK"
            );


        /* =============================================
           RIGHT JOYSTICK
        ============================================= */

        const rightImage =
            await loadImage(
                "controller_RightAnalog_pressed.png"
            );


        const rightData =
            getImageData(
                rightImage
            );


        rightStick =
            createStick(
                normalData,
                rightData,
                "RIGHT STICK"
            );


        console.log(
            "================================"
        );

        console.log(
            "PS5 CONTROLLER READY"
        );

        console.log(
            "Left stick:",
            leftStick
        );

        console.log(
            "Right stick:",
            rightStick
        );

        console.log(
            "================================"
        );


        requestAnimationFrame(
            updateController
        );


    } catch (error) {

        console.error(
            "CONTROLLER ERROR:",
            error
        );
    }
}


/* =====================================================
   RUN
===================================================== */

start();

</script>

</body>
</html>
