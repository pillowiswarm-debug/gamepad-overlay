<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;


/* =====================================================
   BUTTON FILES
===================================================== */

const files = {
    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


/* =====================================================
   BUTTON MAP
===================================================== */

const buttonMap = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   CANVAS
===================================================== */

const baseCanvas =
    document.getElementById("base");

const baseCtx =
    baseCanvas.getContext("2d");


let overlays = {};
let gamepad = null;
let normalImage = null;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () =>
            reject(
                new Error(
                    "Could not load " + src
                )
            );

        img.src = src;
    });
}


/* =====================================================
   CREATE BUTTON OVERLAY
===================================================== */

function createDifferenceOverlay(
    normalData,
    pressedData
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const ctx =
        canvas.getContext("2d");

    const output =
        ctx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;


    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const r1 = normal[i];
        const g1 = normal[i + 1];
        const b1 = normal[i + 2];
        const a1 = normal[i + 3];

        const r2 = pressed[i];
        const g2 = pressed[i + 1];
        const b2 = pressed[i + 2];
        const a2 = pressed[i + 3];


        const difference =
            Math.abs(r1 - r2) +
            Math.abs(g1 - g2) +
            Math.abs(b1 - b2) +
            Math.abs(a1 - a2);


        if (difference > 12) {

            result[i] =
                r2;

            result[i + 1] =
                g2;

            result[i + 2] =
                b2;

            result[i + 3] =
                a2;

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }


    ctx.putImageData(
        output,
        0,
        0
    );


    return canvas;
}


/* =====================================================
   PREPARE BUTTONS
===================================================== */

async function prepareOverlays() {

    try {

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        /*
           Draw normal controller.
        */

        baseCtx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

        baseCtx.drawImage(
            normalImage,
            0,
            0,
            WIDTH,
            HEIGHT
        );


        /*
           Get normal pixels.
        */

        const normalData =
            baseCtx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            );


        /*
           Create every button overlay.
        */

        for (
            const name in files
        ) {

            const pressedImage =
                await loadImage(
                    files[name]
                );


            const temp =
                document.createElement("canvas");

            temp.width =
                WIDTH;

            temp.height =
                HEIGHT;


            const ctx =
                temp.getContext("2d");


            ctx.drawImage(
                pressedImage,
                0,
                0,
                WIDTH,
                HEIGHT
            );


            const pressedData =
                ctx.getImageData(
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );


            overlays[name] =
                createDifferenceOverlay(
                    normalData,
                    pressedData
                );
        }


        console.log(
            "Controller overlays ready."
        );


        requestAnimationFrame(
            updateController
        );


    } catch (error) {

        console.error(
            error
        );
    }
}


/* =====================================================
   FIND GAMEPAD
===================================================== */

function findGamepad() {

    const pads =
        navigator.getGamepads();


    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }


    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad =
                pad;

            return pad;
        }
    }


    return null;
}


/* =====================================================
   UPDATE CONTROLLER
===================================================== */

function updateController() {

    /*
       ALWAYS redraw the normal controller.
    */

    baseCtx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    baseCtx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const pad =
        findGamepad();


    if (pad) {

        /*
           Draw every pressed button.

           Multiple buttons can be pressed
           simultaneously.
        */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];


            if (
                !button ||
                !button.pressed
            )
                continue;


            const name =
                buttonMap[index];


            const overlay =
                overlays[name];


            if (!overlay)
                continue;


            baseCtx.drawImage(
                overlay,
                0,
                0
            );
        }
    }


    requestAnimationFrame(
        updateController
    );
}


/* =====================================================
   GAMEPAD EVENTS
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;

        console.log(
            "Gamepad connected:",
            gamepad.id
        );
    }
);


window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

prepareOverlays();

</script>

</body>
</html>
