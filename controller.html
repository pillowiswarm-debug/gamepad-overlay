<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;

/*
========================================================
BUTTON IMAGES
========================================================
*/

const files = {
    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


/*
========================================================
PLAYSTATION BUTTON MAP
========================================================
*/

const buttonMap = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/*
========================================================
CONTROLLER
========================================================
*/

const baseCanvas = document.getElementById("base");
const baseCtx = baseCanvas.getContext("2d");

let overlays = {};
let normalImage = null;
let gamepad = null;


/*
========================================================
ANALOG SETTINGS
========================================================

Change this number if the sticks move too far.

50 = current maximum movement.
Try 45 or 40 if needed.
*/

const MAX_MOVE = 50;


/*
========================================================
STICK SETTINGS

These are the CENTER positions of the two sticks.

We will adjust these if necessary.
========================================================
*/

/*
    IMPORTANT:

    These are calculated automatically from the
    controller's existing LeftAnalog_pressed and
    RightAnalog_pressed images.
*/

let leftStick = null;
let rightStick = null;


/*
========================================================
LOAD IMAGE
========================================================
*/

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => {
            reject(
                new Error("Could not load " + src)
            );
        };

        img.src = src;
    });
}


/*
========================================================
CREATE BUTTON DIFFERENCE
========================================================
*/

function createDifferenceOverlay(
    normalData,
    pressedData
) {

    const canvas =
        document.createElement("canvas");

    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const ctx =
        canvas.getContext("2d");

    const output =
        ctx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;

    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const r1 = normal[i];
        const g1 = normal[i + 1];
        const b1 = normal[i + 2];
        const a1 = normal[i + 3];

        const r2 = pressed[i];
        const g2 = pressed[i + 1];
        const b2 = pressed[i + 2];
        const a2 = pressed[i + 3];

        const difference =
            Math.abs(r1 - r2) +
            Math.abs(g1 - g2) +
            Math.abs(b1 - b2) +
            Math.abs(a1 - a2);

        if (difference > 40) {

            result[i] = r2;
            result[i + 1] = g2;
            result[i + 2] = b2;
            result[i + 3] = a2;

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }

    ctx.putImageData(output, 0, 0);

    return canvas;
}


/*
========================================================
GET DIFFERENCE BOUNDS

Used to find where the analog stick changes.
========================================================
*/

function getDifferenceBounds(
    normalData,
    pressedData
) {

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    let minX = WIDTH;
    let minY = HEIGHT;
    let maxX = -1;
    let maxY = -1;

    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;

            const difference =
                Math.abs(normal[i] - pressed[i]) +
                Math.abs(normal[i + 1] - pressed[i + 1]) +
                Math.abs(normal[i + 2] - pressed[i + 2]);

            if (difference > 40) {

                minX = Math.min(minX, x);
                minY = Math.min(minY, y);

                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            }
        }
    }

    if (maxX === -1)
        return null;

    return {
        x: minX,
        y: minY,
        width: maxX - minX + 1,
        height: maxY - minY + 1
    };
}


/*
========================================================
PREPARE ANALOG STICK

This creates a movable copy of the stick image.
========================================================
*/

async function prepareStick(
    normalData,
    pressedImage
) {

    const temp =
        document.createElement("canvas");

    temp.width = WIDTH;
    temp.height = HEIGHT;

    const ctx =
        temp.getContext("2d");

    ctx.drawImage(
        pressedImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const pressedData =
        ctx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    const bounds =
        getDifferenceBounds(
            normalData,
            pressedData
        );

    if (!bounds)
        return null;


    /*
        Add padding around the detected stick.
    */

    const padding = 8;

    const x =
        Math.max(
            0,
            bounds.x - padding
        );

    const y =
        Math.max(
            0,
            bounds.y - padding
        );

    const right =
        Math.min(
            WIDTH,
            bounds.x +
            bounds.width +
            padding
        );

    const bottom =
        Math.min(
            HEIGHT,
            bounds.y +
            bounds.height +
            padding
        );

    const cropWidth =
        right - x;

    const cropHeight =
        bottom - y;


    /*
        Make a cropped stick canvas.
    */

    const stickCanvas =
        document.createElement("canvas");

    stickCanvas.width =
        cropWidth;

    stickCanvas.height =
        cropHeight;

    const stickCtx =
        stickCanvas.getContext("2d");

    stickCtx.drawImage(
        pressedImage,
        x,
        y,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
    );


    return {
        image: stickCanvas,

        x: x,
        y: y,

        width: cropWidth,
        height: cropHeight,

        centerX:
            x + cropWidth / 2,

        centerY:
            y + cropHeight / 2
    };
}


/*
========================================================
PREPARE EVERYTHING
========================================================
*/

async function prepareOverlays() {

    try {

        normalImage =
            await loadImage(
                "controller_normal.png"
            );

        /*
            Get normal controller pixels.
        */

        baseCtx.clearRect(
            0,
            0,
            WIDTH,
            HEIGHT
        );

        baseCtx.drawImage(
            normalImage,
            0,
            0,
            WIDTH,
            HEIGHT
        );

        const normalData =
            baseCtx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            );


        /*
            Prepare normal buttons.
        */

        for (
            const name in files
        ) {

            const pressedImage =
                await loadImage(
                    files[name]
                );

            const temp =
                document.createElement("canvas");

            temp.width = WIDTH;
            temp.height = HEIGHT;

            const ctx =
                temp.getContext("2d");

            ctx.drawImage(
                pressedImage,
                0,
                0,
                WIDTH,
                HEIGHT
            );

            const pressedData =
                ctx.getImageData(
                    0,
                    0,
                    WIDTH,
                    HEIGHT
                );

            overlays[name] =
                createDifferenceOverlay(
                    normalData,
                    pressedData
                );
        }


        /*
            Prepare left stick.
        */

        const leftPressed =
            await loadImage(
                "controller_LeftAnalog_pressed.png"
            );

        leftStick =
            await prepareStick(
                normalData,
                leftPressed
            );


        /*
            Prepare right stick.
        */

        const rightPressed =
            await loadImage(
                "controller_RightAnalog_pressed.png"
            );

        rightStick =
            await prepareStick(
                normalData,
                rightPressed
            );


        console.log(
            "Controller ready."
        );

        requestAnimationFrame(
            updateController
        );

    } catch (error) {

        console.error(error);
    }
}


/*
========================================================
FIND GAMEPAD
========================================================
*/

function findGamepad() {

    const pads =
        navigator.getGamepads();

    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }


    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad = pad;

            return pad;
        }
    }

    return null;
}


/*
========================================================
DRAW MOVING STICK
========================================================
*/

function drawStick(
    stick,
    axisX,
    axisY
) {

    if (!stick)
        return;


    /*
        Deadzone.

        Prevents tiny controller drift
        from moving the stick.
    */

    const deadzone = 0.08;

    if (
        Math.abs(axisX) < deadzone
    ) {
        axisX = 0;
    }

    if (
        Math.abs(axisY) < deadzone
    ) {
        axisY = 0;
    }


    /*
        Normalize the remaining value.
    */

    function normalize(value) {

        if (value === 0)
            return 0;

        const sign =
            value < 0 ? -1 : 1;

        const amount =
            Math.abs(value);

        return sign *
            Math.min(
                1,
                (amount - deadzone) /
                (1 - deadzone)
            );
    }

    axisX =
        normalize(axisX);

    axisY =
        normalize(axisY);


    /*
        Convert controller axis
        to screen movement.
    */

    const moveX =
        axisX * MAX_MOVE;

    const moveY =
        axisY * MAX_MOVE;


    /*
        Put the stick back at its
        normal center and move it.
    */

    const drawX =
        stick.x + moveX;

    const drawY =
        stick.y + moveY;


    baseCtx.drawImage(
        stick.image,
        drawX,
        drawY
    );
}


/*
========================================================
UPDATE CONTROLLER
========================================================
*/

function updateController() {

    const pad =
        findGamepad();


    /*
        Start every frame with the
        completely normal controller.
    */

    baseCtx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    baseCtx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    if (pad) {


        /*
        ================================================
        BUTTONS
        ================================================
        */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];

            if (
                !button ||
                !button.pressed
            )
                continue;

            const name =
                buttonMap[index];

            const overlay =
                overlays[name];

            if (!overlay)
                continue;

            baseCtx.drawImage(
                overlay,
                0,
                0
            );
        }


        /*
        ================================================
        LEFT ANALOG
        ================================================
        */

        drawStick(
            leftStick,
            pad.axes[0] || 0,
            pad.axes[1] || 0
        );


        /*
        ================================================
        RIGHT ANALOG
        ================================================
        */

        drawStick(
            rightStick,
            pad.axes[2] || 0,
            pad.axes[3] || 0
        );
    }


    requestAnimationFrame(
        updateController
    );
}


/*
========================================================
GAMEPAD EVENTS
========================================================
*/

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;

        console.log(
            "Gamepad connected:",
            gamepad.id
        );
    }
);


window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/*
========================================================
START
========================================================
*/

prepareOverlays();

</script>

</body>
</html>
