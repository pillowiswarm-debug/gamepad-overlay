<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;

const MAX_MOVE = 50;
const DEADZONE = 0.08;

const canvas = document.getElementById("base");
const ctx = canvas.getContext("2d");

let normalImage;
let gamepad = null;

const overlays = {};


/* =====================================================
   BUTTON FILES
===================================================== */

const buttonFiles = {
    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


/* =====================================================
   BUTTON MAP
===================================================== */

const buttonMap = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () =>
            reject(
                new Error("Failed to load " + src)
            );

        img.src = src;
    });
}


/* =====================================================
   IMAGE DATA
===================================================== */

function getImageData(img) {

    const c = document.createElement("canvas");

    c.width = WIDTH;
    c.height = HEIGHT;

    const cctx = c.getContext("2d");

    cctx.drawImage(
        img,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    return cctx.getImageData(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/* =====================================================
   BUTTON DIFFERENCE
===================================================== */

function makeButtonOverlay(
    normalData,
    pressedData
) {

    const c =
        document.createElement("canvas");

    c.width = WIDTH;
    c.height = HEIGHT;

    const cctx =
        c.getContext("2d");

    const output =
        cctx.createImageData(
            WIDTH,
            HEIGHT
        );

    const n = normalData.data;
    const p = pressedData.data;
    const o = output.data;

    for (
        let i = 0;
        i < n.length;
        i += 4
    ) {

        const difference =
            Math.abs(n[i] - p[i]) +
            Math.abs(n[i + 1] - p[i + 1]) +
            Math.abs(n[i + 2] - p[i + 2]) +
            Math.abs(n[i + 3] - p[i + 3]);

        if (difference >= 40) {

            o[i] = p[i];
            o[i + 1] = p[i + 1];
            o[i + 2] = p[i + 2];
            o[i + 3] = p[i + 3];

        } else {

            o[i] = 0;
            o[i + 1] = 0;
            o[i + 2] = 0;
            o[i + 3] = 0;
        }
    }

    cctx.putImageData(
        output,
        0,
        0
    );

    return c;
}


/* =====================================================
   CREATE STICK SPRITE
===================================================== */

function makeStick(
    normalData,
    pressedData
) {

    const n = normalData.data;
    const p = pressedData.data;


    /*
       First find EVERY pixel that changed.
    */

    let minX = WIDTH;
    let minY = HEIGHT;
    let maxX = -1;
    let maxY = -1;


    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;

            const difference =
                Math.abs(n[i] - p[i]) +
                Math.abs(n[i + 1] - p[i + 1]) +
                Math.abs(n[i + 2] - p[i + 2]) +
                Math.abs(n[i + 3] - p[i + 3]);


            if (difference >= 40) {

                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            }
        }
    }


    if (maxX === -1) {

        console.error(
            "No joystick pixels detected."
        );

        return null;
    }


    /*
       Create a transparent full-size canvas.
    */

    const sprite =
        document.createElement("canvas");

    sprite.width = WIDTH;
    sprite.height = HEIGHT;

    const sctx =
        sprite.getContext("2d");

    const output =
        sctx.createImageData(
            WIDTH,
            HEIGHT
        );

    const o = output.data;


    /*
       Copy ONLY changed pixels.
       Everything else remains transparent.
    */

    for (
        let y = minY;
        y <= maxY;
        y++
    ) {

        for (
            let x = minX;
            x <= maxX;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;

            const difference =
                Math.abs(n[i] - p[i]) +
                Math.abs(n[i + 1] - p[i + 1]) +
                Math.abs(n[i + 2] - p[i + 2]) +
                Math.abs(n[i + 3] - p[i + 3]);


            if (difference >= 40) {

                o[i] = p[i];
                o[i + 1] = p[i + 1];
                o[i + 2] = p[i + 2];
                o[i + 3] = p[i + 3];
            }
        }
    }


    sctx.putImageData(
        output,
        0,
        0
    );


    return {
        image: sprite,

        centerX:
            (minX + maxX) / 2,

        centerY:
            (minY + maxY) / 2
    };
}


/* =====================================================
   PREPARE
===================================================== */

async function prepare() {

    try {

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        const normalData =
            getImageData(
                normalImage
            );


        /* BUTTONS */

        for (
            const name in buttonFiles
        ) {

            const pressed =
                await loadImage(
                    buttonFiles[name]
                );

            const pressedData =
                getImageData(
                    pressed
                );

            overlays[name] =
                makeButtonOverlay(
                    normalData,
                    pressedData
                );
        }


        /* LEFT STICK */

        const leftImage =
            await loadImage(
                "controller_LeftAnalog_pressed.png"
            );

        const leftData =
            getImageData(
                leftImage
            );

        window.leftStick =
            makeStick(
                normalData,
                leftData
            );


        /* RIGHT STICK */

        const rightImage =
            await loadImage(
                "controller_RightAnalog_pressed.png"
            );

        const rightData =
            getImageData(
                rightImage
            );

        window.rightStick =
            makeStick(
                normalData,
                rightData
            );


        console.log(
            "LEFT STICK:",
            window.leftStick
        );

        console.log(
            "RIGHT STICK:",
            window.rightStick
        );

        console.log(
            "CONTROLLER READY"
        );


        requestAnimationFrame(
            update
        );

    } catch (error) {

        console.error(
            "STARTUP ERROR:",
            error
        );
    }
}


/* =====================================================
   GAMEPAD
===================================================== */

function getGamepad() {

    const pads =
        navigator.getGamepads();


    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }


    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad = pad;

            return pad;
        }
    }


    return null;
}


/* =====================================================
   NORMALIZE AXIS
===================================================== */

function normalizeAxis(value) {

    if (
        Math.abs(value) <
        DEADZONE
    ) {

        return 0;
    }


    const sign =
        value < 0 ? -1 : 1;


    const amount =
        (
            Math.abs(value) -
            DEADZONE
        ) /
        (1 - DEADZONE);


    return sign *
        Math.min(
            1,
            amount
        );
}


/* =====================================================
   DRAW STICK
===================================================== */

function drawStick(
    stick,
    axisX,
    axisY
) {

    if (!stick)
        return;


    axisX =
        normalizeAxis(
            axisX
        );

    axisY =
        normalizeAxis(
            axisY
        );


    const x =
        axisX * MAX_MOVE;

    const y =
        axisY * MAX_MOVE;


    /*
       Because the sprite is full-size and
       transparent everywhere except the stick,
       moving this canvas moves ONLY the stick.
    */

    ctx.drawImage(
        stick.image,
        x,
        y
    );
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    /*
       Normal controller.
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const pad =
        getGamepad();


    if (pad) {


        /*
           BUTTONS
        */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];

            if (
                !button ||
                !button.pressed
            )
                continue;


            const overlay =
                overlays[
                    buttonMap[index]
                ];


            if (overlay) {

                ctx.drawImage(
                    overlay,
                    0,
                    0
                );
            }
        }


        /*
           LEFT STICK
        */

        drawStick(
            window.leftStick,
            pad.axes[0] || 0,
            pad.axes[1] || 0
        );


        /*
           RIGHT STICK
        */

        drawStick(
            window.rightStick,
            pad.axes[2] || 0,
            pad.axes[3] || 0
        );
    }


    requestAnimationFrame(
        update
    );
}


/* =====================================================
   EVENTS
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;

        console.log(
            "CONNECTED:",
            gamepad.id
        );
    }
);


window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

prepare();

</script>

</body>
</html>
