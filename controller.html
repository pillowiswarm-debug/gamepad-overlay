<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;


/* =====================================================
   SETTINGS
===================================================== */

/*
   How far the visual stick moves.

   Your Gamepad API gives us -1 to +1.
   50 pixels means full stick = 50 pixels.
*/

const STICK_RANGE = 10;


/*
   Ignore tiny controller drift.
*/

const DEADZONE = 0.10;


/*
   Pixel difference threshold.

   We use this to separate the joystick
   from the normal controller.
*/

const DIFFERENCE_THRESHOLD = 25;


/* =====================================================
   BUTTONS
===================================================== */

const files = {

    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


const buttonMap = {

    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");


let normalImage = null;

let overlays = {};

let gamepad = null;

let leftStick = null;
let rightStick = null;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () =>
            reject(
                new Error(
                    "Could not load " + src
                )
            );

        img.src = src;
    });
}


/* =====================================================
   GET IMAGE DATA
===================================================== */

function imageData(img) {

    const c =
        document.createElement("canvas");

    c.width = WIDTH;
    c.height = HEIGHT;

    const cctx =
        c.getContext("2d");

    cctx.drawImage(
        img,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    return cctx.getImageData(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/* =====================================================
   BUTTON OVERLAY
===================================================== */

function makeButtonOverlay(
    normal,
    pressed
) {

    const c =
        document.createElement("canvas");

    c.width = WIDTH;
    c.height = HEIGHT;

    const cctx =
        c.getContext("2d");

    const output =
        cctx.createImageData(
            WIDTH,
            HEIGHT
        );

    const n =
        normal.data;

    const p =
        pressed.data;

    const o =
        output.data;


    for (
        let i = 0;
        i < n.length;
        i += 4
    ) {

        const difference =
            Math.abs(n[i] - p[i]) +
            Math.abs(n[i + 1] - p[i + 1]) +
            Math.abs(n[i + 2] - p[i + 2]) +
            Math.abs(n[i + 3] - p[i + 3]);


        if (
            difference >
            DIFFERENCE_THRESHOLD
        ) {

            o[i] =
                p[i];

            o[i + 1] =
                p[i + 1];

            o[i + 2] =
                p[i + 2];

            o[i + 3] =
                p[i + 3];

        } else {

            o[i] = 0;
            o[i + 1] = 0;
            o[i + 2] = 0;
            o[i + 3] = 0;
        }
    }


    cctx.putImageData(
        output,
        0,
        0
    );


    return c;
}


/* =====================================================
   FIND CHANGED PIXELS
===================================================== */

function findChangedPixels(
    normal,
    pressed
) {

    const n =
        normal.data;

    const p =
        pressed.data;


    const changed = [];


    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;


            const difference =
                Math.abs(n[i] - p[i]) +
                Math.abs(n[i + 1] - p[i + 1]) +
                Math.abs(n[i + 2] - p[i + 2]) +
                Math.abs(n[i + 3] - p[i + 3]);


            if (
                difference >
                DIFFERENCE_THRESHOLD
            ) {

                changed.push({
                    x,
                    y,
                    i
                });
            }
        }
    }


    return changed;
}


/* =====================================================
   BUILD STICK
===================================================== */

function buildStick(
    normal,
    pressed,
    name
) {

    const changed =
        findChangedPixels(
            normal,
            pressed
        );


    console.log(
        name +
        " changed pixels:",
        changed.length
    );


    if (
        changed.length === 0
    ) {

        console.error(
            name +
            " had no detectable changes."
        );

        return null;
    }


    /*
       Find the bounding box.
    */

    let minX = WIDTH;
    let minY = HEIGHT;

    let maxX = 0;
    let maxY = 0;


    for (
        const pixel of changed
    ) {

        minX =
            Math.min(
                minX,
                pixel.x
            );

        minY =
            Math.min(
                minY,
                pixel.y
            );

        maxX =
            Math.max(
                maxX,
                pixel.x
            );

        maxY =
            Math.max(
                maxY,
                pixel.y
            );
    }


    console.log(
        name +
        " bounds:",
        {
            minX,
            minY,
            maxX,
            maxY
        }
    );


    /*
       Create a transparent FULL-SIZE sprite.

       This is important.

       The canvas stays 1000×667,
       but everything except the changed
       pixels is transparent.

       Therefore moving it moves ONLY
       the joystick pixels.
    */

    const sprite =
        document.createElement("canvas");

    sprite.width =
        WIDTH;

    sprite.height =
        HEIGHT;


    const spriteCtx =
        sprite.getContext("2d");


    const output =
        spriteCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const out =
        output.data;

    const p =
        pressed.data;


    for (
        const pixel of changed
    ) {

        const i =
            pixel.i;


        out[i] =
            p[i];

        out[i + 1] =
            p[i + 1];

        out[i + 2] =
            p[i + 2];

        out[i + 3] =
            p[i + 3];
    }


    spriteCtx.putImageData(
        output,
        0,
        0
    );


    return {

        image: sprite,

        /*
           The original location of the
           joystick's center.
        */

        centerX:
            (minX + maxX) / 2,

        centerY:
            (minY + maxY) / 2,

        minX,
        minY,
        maxX,
        maxY
    };
}


/* =====================================================
   NORMALIZE AXIS
===================================================== */

function axis(value) {

    if (
        Math.abs(value) <
        DEADZONE
    ) {

        return 0;
    }


    const sign =
        value < 0
            ? -1
            : 1;


    const magnitude =
        (
            Math.abs(value) -
            DEADZONE
        )
        /
        (1 - DEADZONE);


    return (
        sign *
        Math.min(
            1,
            magnitude
        )
    );
}


/* =====================================================
   DRAW STICK
===================================================== */

function drawStick(
    stick,
    xAxis,
    yAxis
) {

    if (!stick)
        return;


    const x =
        axis(xAxis) *
        STICK_RANGE;

    const y =
        axis(yAxis) *
        STICK_RANGE;


    /*
       We want:

       normal stick position
       +
       controller movement
    */

    ctx.drawImage(
        stick.image,
        x,
        y
    );
}


/* =====================================================
   FIND GAMEPAD
===================================================== */

function findGamepad() {

    const pads =
        navigator.getGamepads();


    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }


    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad =
                pad;

            return pad;
        }
    }


    return null;
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    /*
       NORMAL CONTROLLER
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const pad =
        findGamepad();


    if (pad) {


        /*
           BUTTONS
        */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];


            if (
                !button ||
                !button.pressed
            )
                continue;


            const overlay =
                overlays[
                    buttonMap[index]
                ];


            if (overlay) {

                ctx.drawImage(
                    overlay,
                    0,
                    0
                );
            }
        }


        /*
           LEFT STICK
        */

        drawStick(
            leftStick,
            pad.axes[0] || 0,
            pad.axes[1] || 0
        );


        /*
           RIGHT STICK
        */

        drawStick(
            rightStick,
            pad.axes[2] || 0,
            pad.axes[3] || 0
        );
    }


    requestAnimationFrame(
        update
    );
}


/* =====================================================
   GAMEPAD EVENTS
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;

        console.log(
            "Gamepad connected:",
            gamepad.id
        );
    }
);


window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

async function start() {

    try {

        console.log(
            "Loading controller..."
        );


        /*
           Normal controller.
        */

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        const normalData =
            imageData(
                normalImage
            );


        /*
           Buttons.
        */

        for (
            const name in files
        ) {

            const pressed =
                await loadImage(
                    files[name]
                );

            const pressedData =
                imageData(
                    pressed
                );


            overlays[name] =
                makeButtonOverlay(
                    normalData,
                    pressedData
                );
        }


        /*
           Left joystick.
        */

        const leftImage =
            await loadImage(
                "controller_LeftAnalog_pressed.png"
            );

        const leftData =
            imageData(
                leftImage
            );


        leftStick =
            buildStick(
                normalData,
                leftData,
                "LEFT STICK"
            );


        /*
           Right joystick.
        */

        const rightImage =
            await loadImage(
                "controller_RightAnalog_pressed.png"
            );

        const rightData =
            imageData(
                rightImage
            );


        rightStick =
            buildStick(
                normalData,
                rightData,
                "RIGHT STICK"
            );


        console.log(
            "================================"
        );

        console.log(
            "CONTROLLER READY"
        );

        console.log(
            "LEFT STICK:",
            leftStick
        );

        console.log(
            "RIGHT STICK:",
            rightStick
        );

        console.log(
            "================================"
        );


        requestAnimationFrame(
            update
        );


    } catch (error) {

        console.error(
            "CONTROLLER ERROR:",
            error
        );
    }
}


start();

</script>

</body>
</html>
