<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;


/* =====================================================
   BUTTON FILES
===================================================== */

const files = {
    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


/* =====================================================
   STANDARD GAMEPAD BUTTON MAP
===================================================== */

const buttonMap = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");


/* =====================================================
   VARIABLES
===================================================== */

let normalImage = null;

let overlays = {};

let gamepad = null;


/*
    THIS controls how far the sticks move.

    50 = maximum movement.
    If it's too much later, lower this to 40 or 35.
*/

const MAX_MOVE = 50;


/* =====================================================
   STICK POSITIONS

   CHANGE THESE ONLY IF THE STICKS ARE NOT CENTERED.

   These are approximate starting positions for a
   1000 x 667 controller image.

   We will adjust them after testing.
===================================================== */

/*
   IMPORTANT:
   These coordinates represent the TOP-LEFT corner
   of the joystick image.
*/

const LEFT_STICK_X = 215;
const LEFT_STICK_Y = 390;

const RIGHT_STICK_X = 555;
const RIGHT_STICK_Y = 390;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.onload =
            () => resolve(img);

        img.onerror =
            () => reject(
                new Error(
                    "Could not load " + src
                )
            );

        img.src = src;
    });
}


/* =====================================================
   BUTTON DIFFERENCE OVERLAY
===================================================== */

function createDifferenceOverlay(
    normalData,
    pressedData
) {

    const overlay =
        document.createElement("canvas");

    overlay.width =
        WIDTH;

    overlay.height =
        HEIGHT;

    const overlayCtx =
        overlay.getContext("2d");

    const output =
        overlayCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;

    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const difference =
            Math.abs(
                normal[i] -
                pressed[i]
            ) +

            Math.abs(
                normal[i + 1] -
                pressed[i + 1]
            ) +

            Math.abs(
                normal[i + 2] -
                pressed[i + 2]
            ) +

            Math.abs(
                normal[i + 3] -
                pressed[i + 3]
            );


        /*
           Same 40 threshold we tested
           successfully with your X overlay.
        */

        if (difference >= 40) {

            result[i] =
                pressed[i];

            result[i + 1] =
                pressed[i + 1];

            result[i + 2] =
                pressed[i + 2];

            result[i + 3] =
                pressed[i + 3];

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }

    overlayCtx.putImageData(
        output,
        0,
        0
    );

    return overlay;
}


/* =====================================================
   PREPARE BUTTON OVERLAYS
===================================================== */

async function prepareButtons() {

    const normalCanvas =
        document.createElement("canvas");

    normalCanvas.width =
        WIDTH;

    normalCanvas.height =
        HEIGHT;

    const normalCtx =
        normalCanvas.getContext("2d");

    normalCtx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const normalData =
        normalCtx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        );


    for (
        const name in files
    ) {

        const pressedImage =
            await loadImage(
                files[name]
            );

        const temp =
            document.createElement("canvas");

        temp.width =
            WIDTH;

        temp.height =
            HEIGHT;

        const tempCtx =
            temp.getContext("2d");

        tempCtx.drawImage(
            pressedImage,
            0,
            0,
            WIDTH,
            HEIGHT
        );

        const pressedData =
            tempCtx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            );

        overlays[name] =
            createDifferenceOverlay(
                normalData,
                pressedData
            );
    }
}


/* =====================================================
   DRAW MOVING ANALOG STICK
===================================================== */

function drawStick(
    image,
    baseX,
    baseY,
    axisX,
    axisY
) {

    if (!image)
        return;


    /*
       Deadzone prevents tiny controller
       drift from moving the visual stick.
    */

    const DEADZONE = 0.08;


    if (
        Math.abs(axisX) <
        DEADZONE
    ) {

        axisX = 0;
    }


    if (
        Math.abs(axisY) <
        DEADZONE
    ) {

        axisY = 0;
    }


    /*
       Scale the stick after the deadzone.
    */

    if (axisX !== 0) {

        const sign =
            axisX < 0 ? -1 : 1;

        axisX =
            sign *
            (
                (Math.abs(axisX) -
                    DEADZONE)
                /
                (1 - DEADZONE)
            );
    }


    if (axisY !== 0) {

        const sign =
            axisY < 0 ? -1 : 1;

        axisY =
            sign *
            (
                (Math.abs(axisY) -
                    DEADZONE)
                /
                (1 - DEADZONE)
            );
    }


    /*
       Convert the Gamepad API values
       into pixel movement.
    */

    const moveX =
        axisX * MAX_MOVE;

    const moveY =
        axisY * MAX_MOVE;


    /*
       Draw the joystick at its normal
       position + the analog movement.
    */

    ctx.drawImage(
        image,
        baseX + moveX,
        baseY + moveY
    );
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    /*
       Always start with the normal controller.
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       Find controller.
    */

    const pads =
        navigator.getGamepads();

    let pad =
        gamepad;


    if (
        pad &&
        pads[pad.index]
    ) {

        pad =
            pads[pad.index];

        gamepad =
            pad;

    } else {

        for (
            const p of pads
        ) {

            if (p) {

                gamepad =
                    p;

                pad =
                    p;

                break;
            }
        }
    }


    if (pad) {


        /* =============================================
           BUTTONS
        ============================================= */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];

            if (
                !button ||
                !button.pressed
            )
                continue;

            const name =
                buttonMap[index];

            const overlay =
                overlays[name];

            if (!overlay)
                continue;

            ctx.drawImage(
                overlay,
                0,
                0
            );
        }


        /* =============================================
           LEFT STICK
        ============================================= */

        drawStick(
            window.leftStickImage,
            LEFT_STICK_X,
            LEFT_STICK_Y,
            pad.axes[0] || 0,
            pad.axes[1] || 0
        );


        /* =============================================
           RIGHT STICK
        ============================================= */

        drawStick(
            window.rightStickImage,
            RIGHT_STICK_X,
            RIGHT_STICK_Y,
            pad.axes[2] || 0,
            pad.axes[3] || 0
        );
    }


    requestAnimationFrame(
        update
    );
}


/* =====================================================
   CONNECT / DISCONNECT
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;

        console.log(
            "Gamepad connected:",
            gamepad.id
        );
    }
);


window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

async function start() {

    try {

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        /*
           Load the actual joystick PNGs.
        */

        window.leftStickImage =
            await loadImage(
                "controller_LeftAnalog_pressed.png"
            );

        window.rightStickImage =
            await loadImage(
                "controller_RightAnalog_pressed.png"
            );


        /*
           Prepare buttons.
        */

        await prepareButtons();


        console.log(
            "Controller ready."
        );


        requestAnimationFrame(
            update
        );

    } catch (error) {

        console.error(
            error
        );
    }
}


start();

</script>

</body>
</html>
