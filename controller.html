<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    width: 1000px;
    height: 667px;
    position: relative;
}

#controller img {
    width: 1000px;
    height: 667px;
    display: block;
}
</style>
</head>

<body>

<div id="controller">
    <img id="controllerImage" src="controller_normal.png">
</div>

<script>
const controllerImage = document.getElementById("controllerImage");

const images = {
    normal: "controller_normal.png",

    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    LeftAnalog: "controller_LeftAnalog_pressed.png",
    RightAnalog: "controller_RightAnalog_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};

const loadedImages = {};

for (const key in images) {
    const img = new Image();
    img.src = images[key];
    loadedImages[key] = img;
}

let activeGamepad = null;

window.addEventListener("gamepadconnected", function(event) {
    activeGamepad = event.gamepad;
    console.log("Controller connected:", activeGamepad.id);
});

window.addEventListener("gamepaddisconnected", function(event) {
    if (activeGamepad && event.gamepad.index === activeGamepad.index) {
        activeGamepad = null;
        controllerImage.src = images.normal;
    }
});

function findGamepad() {
    const gamepads = navigator.getGamepads();

    if (activeGamepad) {
        const current = gamepads[activeGamepad.index];

        if (current) {
            activeGamepad = current;
            return current;
        }
    }

    for (const gamepad of gamepads) {
        if (gamepad) {
            activeGamepad = gamepad;
            return gamepad;
        }
    }

    return null;
}

function setImage(name) {
    controllerImage.src = images[name];
}

function updateController() {
    const gamepad = findGamepad();

    if (!gamepad) {
        setImage("normal");
        requestAnimationFrame(updateController);
        return;
    }

    let pressedImage = "normal";

    /*
       PS5 / DualSense standard button mapping:

       0 = X
       1 = Circle
       2 = Square
       3 = Triangle
       4 = L1
       5 = R1
       10 = L3
       11 = R3
       12 = D-pad Up
       13 = D-pad Down
       14 = D-pad Left
       15 = D-pad Right
    */

    if (gamepad.buttons[0]?.pressed) {
        pressedImage = "x";
    }
    else if (gamepad.buttons[1]?.pressed) {
        pressedImage = "o";
    }
    else if (gamepad.buttons[2]?.pressed) {
        pressedImage = "square";
    }
    else if (gamepad.buttons[3]?.pressed) {
        pressedImage = "triangle";
    }
    else if (gamepad.buttons[4]?.pressed) {
        pressedImage = "L1";
    }
    else if (gamepad.buttons[5]?.pressed) {
        pressedImage = "R1";
    }
    else if (gamepad.buttons[10]?.pressed) {
        pressedImage = "LeftAnalog";
    }
    else if (gamepad.buttons[11]?.pressed) {
        pressedImage = "RightAnalog";
    }
    else if (gamepad.buttons[12]?.pressed) {
        pressedImage = "dpadup";
    }
    else if (gamepad.buttons[13]?.pressed) {
        pressedImage = "dpaddown";
    }
    else if (gamepad.buttons[14]?.pressed) {
        pressedImage = "dpadleft";
    }
    else if (gamepad.buttons[15]?.pressed) {
        pressedImage = "dpadright";
    }
    else if (gamepad.buttons[9]?.pressed) {
        pressedImage = "touchpad";
    }

    setImage(pressedImage);

    requestAnimationFrame(updateController);
}

updateController();
</script>

</body>
</html>
