<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;


/* =====================================================
   JOYSTICK SETTINGS
===================================================== */

/*
   Maximum visual movement of each joystick.

   Lower = less movement
   Higher = more movement

   Start with 35 because your previous version
   was moving slightly too far.
*/

const STICK_RANGE = 35;


/*
   Ignore tiny controller stick drift.
*/

const DEADZONE = 0.08;


/*
   How different a pixel must be between the
   normal and pressed images to count as changed.
*/

const DIFFERENCE_THRESHOLD = 25;


/* =====================================================
   BUTTON FILES
===================================================== */

const files = {

    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",

    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",

    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",

    touchpad: "controller_touchpad_pressed.png"
};


/* =====================================================
   BUTTON MAP
===================================================== */

const buttonMap = {

    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");


let normalImage = null;

let overlays = {};

let gamepad = null;

let leftStick = null;

let rightStick = null;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () =>
            reject(
                new Error(
                    "Could not load " + src
                )
            );

        img.src = src;
    });
}


/* =====================================================
   GET IMAGE DATA
===================================================== */

function getImageData(img) {

    const c =
        document.createElement("canvas");

    c.width = WIDTH;
    c.height = HEIGHT;

    const cctx =
        c.getContext("2d");

    cctx.drawImage(
        img,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    return cctx.getImageData(
        0,
        0,
        WIDTH,
        HEIGHT
    );
}


/* =====================================================
   BUTTON DIFFERENCE OVERLAY
===================================================== */

function createButtonOverlay(
    normalData,
    pressedData
) {

    const c =
        document.createElement("canvas");

    c.width = WIDTH;
    c.height = HEIGHT;

    const cctx =
        c.getContext("2d");

    const output =
        cctx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;


    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const difference =
            Math.abs(
                normal[i] -
                pressed[i]
            ) +

            Math.abs(
                normal[i + 1] -
                pressed[i + 1]
            ) +

            Math.abs(
                normal[i + 2] -
                pressed[i + 2]
            ) +

            Math.abs(
                normal[i + 3] -
                pressed[i + 3]
            );


        if (
            difference >
            12
        ) {

            result[i] =
                pressed[i];

            result[i + 1] =
                pressed[i + 1];

            result[i + 2] =
                pressed[i + 2];

            result[i + 3] =
                pressed[i + 3];

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }


    cctx.putImageData(
        output,
        0,
        0
    );


    return c;
}


/* =====================================================
   FIND STICK PIXELS
===================================================== */

function findStickPixels(
    normalData,
    pressedData
) {

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;


    const pixels = [];


    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;


            const difference =
                Math.abs(
                    normal[i] -
                    pressed[i]
                ) +

                Math.abs(
                    normal[i + 1] -
                    pressed[i + 1]
                ) +

                Math.abs(
                    normal[i + 2] -
                    pressed[i + 2]
                ) +

                Math.abs(
                    normal[i + 3] -
                    pressed[i + 3]
                );


            if (
                difference >
                DIFFERENCE_THRESHOLD
            ) {

                pixels.push({
                    x: x,
                    y: y,
                    index: i
                });
            }
        }
    }


    return pixels;
}


/* =====================================================
   CREATE STICK SPRITE
===================================================== */

function createStickSprite(
    normalData,
    pressedData,
    name
) {

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;


    const pixels =
        findStickPixels(
            normalData,
            pressedData
        );


    console.log(
        name +
        " changed pixels:",
        pixels.length
    );


    if (
        pixels.length === 0
    ) {

        console.error(
            name +
            " could not be detected."
        );

        return null;
    }


    /*
       Find the original location
       of the joystick.
    */

    let minX = WIDTH;
    let minY = HEIGHT;

    let maxX = 0;
    let maxY = 0;


    for (
        const pixel of pixels
    ) {

        minX =
            Math.min(
                minX,
                pixel.x
            );

        minY =
            Math.min(
                minY,
                pixel.y
            );

        maxX =
            Math.max(
                maxX,
                pixel.x
            );

        maxY =
            Math.max(
                maxY,
                pixel.y
            );
    }


    const centerX =
        (minX + maxX) / 2;

    const centerY =
        (minY + maxY) / 2;


    console.log(
        name +
        " original center:",
        centerX,
        centerY
    );


    console.log(
        name +
        " bounds:",
        minX,
        minY,
        maxX,
        maxY
    );


    /*
       Full-size transparent sprite.

       The joystick remains at its original
       controller coordinates.
    */

    const sprite =
        document.createElement("canvas");

    sprite.width =
        WIDTH;

    sprite.height =
        HEIGHT;


    const spriteCtx =
        sprite.getContext("2d");


    const output =
        spriteCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const result =
        output.data;


    /*
       Copy ONLY the joystick pixels.
    */

    for (
        const pixel of pixels
    ) {

        const i =
            pixel.index;


        result[i] =
            pressed[i];

        result[i + 1] =
            pressed[i + 1];

        result[i + 2] =
            pressed[i + 2];

        result[i + 3] =
            pressed[i + 3];
    }


    spriteCtx.putImageData(
        output,
        0,
        0
    );


    return {

        image: sprite,

        centerX: centerX,

        centerY: centerY
    };
}


/* =====================================================
   DEADZONE
===================================================== */

function normalizeAxis(value) {

    if (
        Math.abs(value) <
        DEADZONE
    ) {

        return 0;
    }


    const sign =
        value < 0
            ? -1
            : 1;


    const amount =
        (
            Math.abs(value) -
            DEADZONE
        )
        /
        (1 - DEADZONE);


    return (
        sign *
        Math.min(
            amount,
            1
        )
    );
}


/* =====================================================
   DRAW MOVING STICK
===================================================== */

function drawStick(
    stick,
    axisX,
    axisY
) {

    if (!stick)
        return;


    const normalizedX =
        normalizeAxis(
            axisX
        );

    const normalizedY =
        normalizeAxis(
            axisY
        );


    const moveX =
        normalizedX *
        STICK_RANGE;


    const moveY =
        normalizedY *
        STICK_RANGE;


    /*
       IMPORTANT:

       The stick sprite is already positioned
       at its ORIGINAL location inside the
       1000x667 transparent canvas.

       We translate that whole transparent
       canvas by the analog movement.

       Only the joystick pixels are visible,
       so only the joystick appears to move.
    */

    ctx.save();


    ctx.translate(
        moveX,
        moveY
    );


    ctx.drawImage(
        stick.image,
        0,
        0
    );


    ctx.restore();
}


/* =====================================================
   FIND GAMEPAD
===================================================== */

function findGamepad() {

    const pads =
        navigator.getGamepads();


    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }


    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad =
                pad;

            return pad;
        }
    }


    return null;
}


/* =====================================================
   UPDATE CONTROLLER
===================================================== */

function updateController() {

    /*
       Draw the normal controller first.
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const pad =
        findGamepad();


    if (pad) {


        /* =============================================
           BUTTONS
        ============================================= */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];


            if (
                !button ||
                !button.pressed
            )
                continue;


            const name =
                buttonMap[index];


            const overlay =
                overlays[name];


            if (!overlay)
                continue;


            ctx.drawImage(
                overlay,
                0,
                0
            );
        }


        /* =============================================
           LEFT ANALOG
        ============================================= */

        drawStick(
            leftStick,

            pad.axes[0] ||
            0,

            pad.axes[1] ||
            0
        );


        /* =============================================
           RIGHT ANALOG
        ============================================= */

        drawStick(
            rightStick,

            pad.axes[2] ||
            0,

            pad.axes[3] ||
            0
        );
    }


    requestAnimationFrame(
        updateController
    );
}


/* =====================================================
   GAMEPAD CONNECTED
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;


        console.log(
            "Gamepad connected:",
            gamepad.id
        );
    }
);


/* =====================================================
   GAMEPAD DISCONNECTED
===================================================== */

window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            event.gamepad.index ===
            gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

async function start() {

    try {

        console.log(
            "Loading PS5 controller..."
        );


        /* =============================================
           NORMAL CONTROLLER
        ============================================= */

        normalImage =
            await loadImage(
                "controller_normal.png"
            );


        const normalData =
            getImageData(
                normalImage
            );


        /* =============================================
           BUTTON OVERLAYS
        ============================================= */

        for (
            const name in files
        ) {

            const pressedImage =
                await loadImage(
                    files[name]
                );


            const pressedData =
                getImageData(
                    pressedImage
                );


            overlays[name] =
                createButtonOverlay(
                    normalData,
                    pressedData
                );
        }


        /* =============================================
           LEFT STICK
        ============================================= */

        const leftImage =
            await loadImage(
                "controller_LeftAnalog_pressed.png"
            );


        const leftData =
            getImageData(
                leftImage
            );


        leftStick =
            createStickSprite(
                normalData,
                leftData,
                "LEFT STICK"
            );


        /* =============================================
           RIGHT STICK
        ============================================= */

        const rightImage =
            await loadImage(
                "controller_RightAnalog_pressed.png"
            );


        const rightData =
            getImageData(
                rightImage
            );


        rightStick =
            createStickSprite(
                normalData,
                rightData,
                "RIGHT STICK"
            );


        console.log(
            "================================"
        );

        console.log(
            "PS5 CONTROLLER READY"
        );

        console.log(
            "LEFT STICK:",
            leftStick
        );

        console.log(
            "RIGHT STICK:",
            rightStick
        );

        console.log(
            "================================"
        );


        requestAnimationFrame(
            updateController
        );


    } catch (error) {

        console.error(
            "CONTROLLER ERROR:",
            error
        );
    }
}


start();

</script>

</body>
</html>
