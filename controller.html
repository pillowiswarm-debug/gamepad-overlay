<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

.layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    display: block;
    pointer-events: none;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="controller">

    <!-- Normal controller -->
    <img
        id="normal"
        class="layer"
        src="controller_normal.png"
    >

    <!-- Pressed layers -->
    <img id="x" class="layer hidden" src="controller_x_pressed.png">
    <img id="o" class="layer hidden" src="controller_o_pressed.png">
    <img id="square" class="layer hidden" src="controller_square_pressed.png">
    <img id="triangle" class="layer hidden" src="controller_triangle_pressed.png">

    <img id="L1" class="layer hidden" src="controller_L1_pressed.png">
    <img id="R1" class="layer hidden" src="controller_R1_pressed.png">

    <img id="LeftAnalog" class="layer hidden" src="controller_LeftAnalog_pressed.png">
    <img id="RightAnalog" class="layer hidden" src="controller_RightAnalog_pressed.png">

    <img id="dpadup" class="layer hidden" src="controller_dpadup_pressed.png">
    <img id="dpaddown" class="layer hidden" src="controller_dpaddown_pressed.png">
    <img id="dpadleft" class="layer hidden" src="controller_dpadleft_pressed.png">
    <img id="dpadright" class="layer hidden" src="controller_dpadright_pressed.png">

    <img id="touchpad" class="layer hidden" src="controller_touchpad_pressed.png">

</div>

<script>

const buttons = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",

    4: "L1",
    5: "R1",

    10: "LeftAnalog",
    11: "RightAnalog",

    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",

    9: "touchpad"
};

const layers = {};

for (const key in buttons) {
    layers[buttons[key]] = document.getElementById(buttons[key]);
}

let gamepad = null;

function findGamepad() {

    const gamepads = navigator.getGamepads();

    if (gamepad && gamepads[gamepad.index]) {
        gamepad = gamepads[gamepad.index];
        return gamepad;
    }

    for (const g of gamepads) {
        if (g) {
            gamepad = g;
            return g;
        }
    }

    return null;
}

function updateButtonLayers() {

    const pad = findGamepad();

    if (!pad) {
        requestAnimationFrame(updateButtonLayers);
        return;
    }

    for (const buttonIndex in buttons) {

        const name = buttons[buttonIndex];
        const layer = layers[name];

        if (!layer) continue;

        const button = pad.buttons[buttonIndex];

        if (button && button.pressed) {
            layer.classList.remove("hidden");
        } else {
            layer.classList.add("hidden");
        }
    }

    requestAnimationFrame(updateButtonLayers);
}

window.addEventListener("gamepadconnected", event => {
    gamepad = event.gamepad;
});

window.addEventListener("gamepaddisconnected", event => {

    if (gamepad && event.gamepad.index === gamepad.index) {
        gamepad = null;
    }

});

updateButtonLayers();

</script>

</body>
</html>
