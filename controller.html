<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #333;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;

const MAX_MOVE = 50;
const DEADZONE = 0.08;

const files = {
    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",
    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",
    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",
    touchpad: "controller_touchpad_pressed.png"
};

const buttonMap = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",
    4: "L1",
    5: "R1",
    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",
    9: "touchpad"
};

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");

let normalImage = null;
let overlays = {};
let gamepad = null;

let leftStick = null;
let rightStick = null;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () =>
            reject(
                new Error(
                    "Could not load " + src
                )
            );

        img.src = src;
    });
}


/* =====================================================
   MAKE BUTTON OVERLAY
===================================================== */

function makeOverlay(
    normalData,
    pressedData
) {

    const resultCanvas =
        document.createElement("canvas");

    resultCanvas.width = WIDTH;
    resultCanvas.height = HEIGHT;

    const resultCtx =
        resultCanvas.getContext("2d");

    const output =
        resultCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;

    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const difference =
            Math.abs(normal[i] - pressed[i]) +
            Math.abs(normal[i + 1] - pressed[i + 1]) +
            Math.abs(normal[i + 2] - pressed[i + 2]) +
            Math.abs(normal[i + 3] - pressed[i + 3]);

        if (difference >= 40) {

            result[i] =
                pressed[i];

            result[i + 1] =
                pressed[i + 1];

            result[i + 2] =
                pressed[i + 2];

            result[i + 3] =
                pressed[i + 3];

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }

    resultCtx.putImageData(
        output,
        0,
        0
    );

    return resultCanvas;
}


/* =====================================================
   FIND DIFFERENCE BOUNDS
===================================================== */

function findBounds(
    normalData,
    pressedData
) {

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    let minX = WIDTH;
    let minY = HEIGHT;
    let maxX = -1;
    let maxY = -1;

    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;

            const difference =
                Math.abs(normal[i] - pressed[i]) +
                Math.abs(normal[i + 1] - pressed[i + 1]) +
                Math.abs(normal[i + 2] - pressed[i + 2]) +
                Math.abs(normal[i + 3] - pressed[i + 3]);

            if (difference >= 40) {

                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
            }
        }
    }

    if (maxX < 0)
        return null;

    return {
        x: minX,
        y: minY,
        width: maxX - minX + 1,
        height: maxY - minY + 1
    };
}


/* =====================================================
   CREATE STICK IMAGE
===================================================== */

function createStick(normalData, pressedImage) {

    const temp = document.createElement("canvas");

    temp.width = WIDTH;
    temp.height = HEIGHT;

    const tempCtx = temp.getContext("2d");

    tempCtx.drawImage(
        pressedImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const pressedData = tempCtx.getImageData(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const normal = normalData.data;
    const pressed = pressedData.data;

    let minX = WIDTH;
    let minY = HEIGHT;
    let maxX = -1;
    let maxY = -1;

    /*
       Create a transparent image containing
       ONLY the pixels that changed.
    */

    const outputCanvas = document.createElement("canvas");

    outputCanvas.width = WIDTH;
    outputCanvas.height = HEIGHT;

    const outputCtx = outputCanvas.getContext("2d");

    const output = outputCtx.createImageData(
        WIDTH,
        HEIGHT
    );

    const result = output.data;

    for (let i = 0; i < normal.length; i += 4) {

        const difference =
            Math.abs(normal[i] - pressed[i]) +
            Math.abs(normal[i + 1] - pressed[i + 1]) +
            Math.abs(normal[i + 2] - pressed[i + 2]) +
            Math.abs(normal[i + 3] - pressed[i + 3]);

        if (difference >= 40) {

            result[i] = pressed[i];
            result[i + 1] = pressed[i + 1];
            result[i + 2] = pressed[i + 2];
            result[i + 3] = pressed[i + 3];

            const pixel = i / 4;

            const x = pixel % WIDTH;
            const y = Math.floor(pixel / WIDTH);

            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }

    if (maxX < 0) {
        console.log("Could not find stick.");
        return null;
    }

    outputCtx.putImageData(
        output,
        0,
        0
    );

    /*
       Crop the transparent image down to the
       actual changed area.
    */

    const padding = 5;

    const cropX = Math.max(
        0,
        minX - padding
    );

    const cropY = Math.max(
        0,
        minY - padding
    );

    const cropRight = Math.min(
        WIDTH,
        maxX + padding + 1
    );

    const cropBottom = Math.min(
        HEIGHT,
        maxY + padding + 1
    );

    const cropWidth =
        cropRight - cropX;

    const cropHeight =
        cropBottom - cropY;

    const stickCanvas =
        document.createElement("canvas");

    stickCanvas.width =
        cropWidth;

    stickCanvas.height =
        cropHeight;

    const stickCtx =
        stickCanvas.getContext("2d");

    /*
       This is the important part:
       the surrounding square is transparent.
    */

    stickCtx.drawImage(
        outputCanvas,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        cropWidth,
        cropHeight
    );

    return {
        image: stickCanvas,

        x: cropX,
        y: cropY,

        width: cropWidth,
        height: cropHeight
    };
}
