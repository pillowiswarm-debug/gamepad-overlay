<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PS5 Controller Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #333;
    overflow: hidden;
}

#controller {
    position: relative;
    width: 1000px;
    height: 667px;
}

canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 667px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="controller">
    <canvas id="base" width="1000" height="667"></canvas>
</div>

<script>

const WIDTH = 1000;
const HEIGHT = 667;

const MAX_MOVE = 50;
const DEADZONE = 0.08;

const files = {
    x: "controller_x_pressed.png",
    o: "controller_o_pressed.png",
    square: "controller_square_pressed.png",
    triangle: "controller_triangle_pressed.png",
    L1: "controller_L1_pressed.png",
    R1: "controller_R1_pressed.png",
    dpadup: "controller_dpadup_pressed.png",
    dpaddown: "controller_dpaddown_pressed.png",
    dpadleft: "controller_dpadleft_pressed.png",
    dpadright: "controller_dpadright_pressed.png",
    touchpad: "controller_touchpad_pressed.png"
};

const buttonMap = {
    0: "x",
    1: "o",
    2: "square",
    3: "triangle",
    4: "L1",
    5: "R1",
    12: "dpadup",
    13: "dpaddown",
    14: "dpadleft",
    15: "dpadright",
    9: "touchpad"
};

const canvas =
    document.getElementById("base");

const ctx =
    canvas.getContext("2d");

let normalImage = null;
let overlays = {};
let gamepad = null;

let leftStick = null;
let rightStick = null;


/* =====================================================
   LOAD IMAGE
===================================================== */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () =>
            reject(
                new Error(
                    "Could not load " + src
                )
            );

        img.src = src;
    });
}


/* =====================================================
   MAKE BUTTON OVERLAY
===================================================== */

function makeOverlay(
    normalData,
    pressedData
) {

    const resultCanvas =
        document.createElement("canvas");

    resultCanvas.width = WIDTH;
    resultCanvas.height = HEIGHT;

    const resultCtx =
        resultCanvas.getContext("2d");

    const output =
        resultCtx.createImageData(
            WIDTH,
            HEIGHT
        );

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    const result =
        output.data;

    for (
        let i = 0;
        i < normal.length;
        i += 4
    ) {

        const difference =
            Math.abs(normal[i] - pressed[i]) +
            Math.abs(normal[i + 1] - pressed[i + 1]) +
            Math.abs(normal[i + 2] - pressed[i + 2]) +
            Math.abs(normal[i + 3] - pressed[i + 3]);

        if (difference >= 40) {

            result[i] =
                pressed[i];

            result[i + 1] =
                pressed[i + 1];

            result[i + 2] =
                pressed[i + 2];

            result[i + 3] =
                pressed[i + 3];

        } else {

            result[i] = 0;
            result[i + 1] = 0;
            result[i + 2] = 0;
            result[i + 3] = 0;
        }
    }

    resultCtx.putImageData(
        output,
        0,
        0
    );

    return resultCanvas;
}


/* =====================================================
   FIND DIFFERENCE BOUNDS
===================================================== */

function findBounds(
    normalData,
    pressedData
) {

    const normal =
        normalData.data;

    const pressed =
        pressedData.data;

    let minX = WIDTH;
    let minY = HEIGHT;
    let maxX = -1;
    let maxY = -1;

    for (
        let y = 0;
        y < HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < WIDTH;
            x++
        ) {

            const i =
                (y * WIDTH + x) * 4;

            const difference =
                Math.abs(normal[i] - pressed[i]) +
                Math.abs(normal[i + 1] - pressed[i + 1]) +
                Math.abs(normal[i + 2] - pressed[i + 2]) +
                Math.abs(normal[i + 3] - pressed[i + 3]);

            if (difference >= 40) {

                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;
            }
        }
    }

    if (maxX < 0)
        return null;

    return {
        x: minX,
        y: minY,
        width: maxX - minX + 1,
        height: maxY - minY + 1
    };
}


/* =====================================================
   CREATE STICK IMAGE
===================================================== */

function createStick(
    normalData,
    pressedImage
) {

    const temp =
        document.createElement("canvas");

    temp.width = WIDTH;
    temp.height = HEIGHT;

    const tempCtx =
        temp.getContext("2d");

    tempCtx.drawImage(
        pressedImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const pressedData =
        tempCtx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    const bounds =
        findBounds(
            normalData,
            pressedData
        );

    if (!bounds)
        return null;


    /*
       Extra padding keeps the complete
       joystick visible.
    */

    const padding = 15;

    const cropX =
        Math.max(
            0,
            bounds.x - padding
        );

    const cropY =
        Math.max(
            0,
            bounds.y - padding
        );

    const cropRight =
        Math.min(
            WIDTH,
            bounds.x +
            bounds.width +
            padding
        );

    const cropBottom =
        Math.min(
            HEIGHT,
            bounds.y +
            bounds.height +
            padding
        );

    const cropWidth =
        cropRight - cropX;

    const cropHeight =
        cropBottom - cropY;


    /*
       Create transparent image.
    */

    const stickCanvas =
        document.createElement("canvas");

    stickCanvas.width =
        cropWidth;

    stickCanvas.height =
        cropHeight;

    const stickCtx =
        stickCanvas.getContext("2d");


    /*
       Draw ONLY the pressed stick region.
    */

    stickCtx.drawImage(
        pressedImage,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
    );


    return {
        image: stickCanvas,

        x: cropX,
        y: cropY,

        width: cropWidth,
        height: cropHeight
    };
}


/* =====================================================
   PREPARE
===================================================== */

async function prepare() {

    normalImage =
        await loadImage(
            "controller_normal.png"
        );


    /*
       Get normal pixels.
    */

    const normalCanvas =
        document.createElement("canvas");

    normalCanvas.width =
        WIDTH;

    normalCanvas.height =
        HEIGHT;

    const normalCtx =
        normalCanvas.getContext("2d");

    normalCtx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    const normalData =
        normalCtx.getImageData(
            0,
            0,
            WIDTH,
            HEIGHT
        );


    /*
       Prepare buttons.
    */

    for (
        const name in files
    ) {

        const pressed =
            await loadImage(
                files[name]
            );

        const temp =
            document.createElement("canvas");

        temp.width = WIDTH;
        temp.height = HEIGHT;

        const tempCtx =
            temp.getContext("2d");

        tempCtx.drawImage(
            pressed,
            0,
            0,
            WIDTH,
            HEIGHT
        );

        const pressedData =
            tempCtx.getImageData(
                0,
                0,
                WIDTH,
                HEIGHT
            );

        overlays[name] =
            makeOverlay(
                normalData,
                pressedData
            );
    }


    /*
       Prepare actual sticks.
    */

    const leftPressed =
        await loadImage(
            "controller_LeftAnalog_pressed.png"
        );

    const rightPressed =
        await loadImage(
            "controller_RightAnalog_pressed.png"
        );

    leftStick =
        createStick(
            normalData,
            leftPressed
        );

    rightStick =
        createStick(
            normalData,
            rightPressed
        );


    console.log(
        "LEFT STICK:",
        leftStick
    );

    console.log(
        "RIGHT STICK:",
        rightStick
    );


    requestAnimationFrame(
        update
    );
}


/* =====================================================
   STICK DRAWING
===================================================== */

function drawStick(
    stick,
    x,
    y
) {

    if (!stick)
        return;


    /*
       Deadzone.
    */

    if (
        Math.abs(x) <
        DEADZONE
    ) {

        x = 0;
    }

    if (
        Math.abs(y) <
        DEADZONE
    ) {

        y = 0;
    }


    /*
       Normalize.
    */

    if (x !== 0) {

        const sign =
            x < 0 ? -1 : 1;

        x =
            sign *
            (
                (Math.abs(x) -
                    DEADZONE)
                /
                (1 - DEADZONE)
            );
    }

    if (y !== 0) {

        const sign =
            y < 0 ? -1 : 1;

        y =
            sign *
            (
                (Math.abs(y) -
                    DEADZONE)
                /
                (1 - DEADZONE)
            );
    }


    /*
       Movement.
    */

    const moveX =
        x * MAX_MOVE;

    const moveY =
        y * MAX_MOVE;


    /*
       Draw stick at its original
       location plus movement.
    */

    ctx.drawImage(
        stick.image,
        stick.x + moveX,
        stick.y + moveY
    );
}


/* =====================================================
   FIND CONTROLLER
===================================================== */

function getController() {

    const pads =
        navigator.getGamepads();

    if (
        gamepad &&
        pads[gamepad.index]
    ) {

        gamepad =
            pads[gamepad.index];

        return gamepad;
    }

    for (
        const pad of pads
    ) {

        if (pad) {

            gamepad =
                pad;

            return pad;
        }
    }

    return null;
}


/* =====================================================
   UPDATE
===================================================== */

function update() {

    /*
       Draw normal controller.
    */

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.drawImage(
        normalImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    const pad =
        getController();


    if (pad) {

        /*
           Buttons.
        */

        for (
            const index in buttonMap
        ) {

            const button =
                pad.buttons[index];

            if (
                !button ||
                !button.pressed
            )
                continue;

            const overlay =
                overlays[
                    buttonMap[index]
                ];

            if (overlay) {

                ctx.drawImage(
                    overlay,
                    0,
                    0
                );
            }
        }


        /*
           LEFT STICK
        */

        drawStick(
            leftStick,
            pad.axes[0] || 0,
            pad.axes[1] || 0
        );


        /*
           RIGHT STICK
        */

        drawStick(
            rightStick,
            pad.axes[2] || 0,
            pad.axes[3] || 0
        );
    }


    requestAnimationFrame(
        update
    );
}


/* =====================================================
   EVENTS
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        gamepad =
            event.gamepad;

        console.log(
            "CONNECTED:",
            gamepad.id
        );
    }
);


window.addEventListener(
    "gamepaddisconnected",
    event => {

        if (
            gamepad &&
            gamepad.index ===
            event.gamepad.index
        ) {

            gamepad = null;
        }
    }
);


/* =====================================================
   START
===================================================== */

prepare();

</script>

</body>
</html>
